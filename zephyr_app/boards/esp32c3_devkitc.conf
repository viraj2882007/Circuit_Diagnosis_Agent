/**
 * Zephyr board configuration for ESP32-C3 DevKitC
 */

#include <zephyr/kernel.h>

/* GPIO configuration */
#define GPIO_PORTS "gpio0", "gpio1"

/* ADC configuration */
#define ADC_CHANNELS 6

/* UART configuration - console on UART0 */
#define CONSOLE_UART "uart0"

/* SPI configuration */
#define SPI_BUS "spi2"

/* I2C configuration */
#define I2C_BUS "i2c0"

/* PWM configuration */
#define PWM_DEV "ledc0"

/* Counter/TIMER */
#define TIMER_DEV "timer0"

/* Flash */
#define FLASH_DEV "flash0"

/* Entropy/RNG */
#define ENTROPY_DEV "rng"

/* USB */
#define USB_DEV "usb_dc"

/* WiFi */
#define WIFI_DEV "wifi0"

/* Bluetooth */
#define BT_DEV "bt0"