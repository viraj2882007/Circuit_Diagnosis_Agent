/**
 * Zephyr board configuration for Arduino Mega (ATmega2560)
 */

#include <zephyr/kernel.h>

/* GPIO configuration */
#define GPIO_PORTS "gpioa", "gpiob", "gpioc", "gpiod", "gpioe", "gpiof", "gpiog", "gpioh", "gpioj", "gpiok", "gpiol"

/* ADC configuration */
#define ADC_CHANNELS 16

/* UART configuration - console on UART0 (PE0/PE1) */
#define CONSOLE_UART "uart0"

/* SPI configuration - SPI0 */
#define SPI_BUS "spi0"

/* I2C configuration - I2C0 */
#define I2C_BUS "i2c0"

/* PWM configuration */
#define PWM_DEV "pwm0"

/* Counter/TIMER */
#define TIMER_DEV "timer0"

/* Flash */
#define FLASH_DEV "flash0"

/* Entropy/RNG */
#define ENTROPY_DEV "rng"