/**
 * Zephyr board configuration for Raspberry Pi Pico (RP2040)
 */

#include <zephyr/kernel.h>

/* GPIO configuration */
#define GPIO_PORTS "gpio0"

/* ADC configuration */
#define ADC_CHANNELS 4

/* UART configuration - console on UART0 (GP0/GP1) */
#define CONSOLE_UART "uart0"

/* SPI configuration - SPI0, SPI1 */
#define SPI_BUS "spi0"

/* I2C configuration - I2C0, I2C1 */
#define I2C_BUS "i2c0"

/* PWM configuration */
#define PWM_DEV "pwm0"

/* Counter/TIMER */
#define TIMER_DEV "timer0"

/* Flash */
#define FLASH_DEV "flash0"

/* Entropy/RNG */
#define ENTROPY_DEV "rng"

/* USB */
#define USB_DEV "usb_dc"

/* PIO */
#define PIO_DEV "pio0"