/**
 * Zephyr board configuration for STM32F103C8 (BluePill / Nucleo-F103RB)
 */

#include <zephyr/kernel.h>

/* GPIO configuration */
#define GPIO_PORTS "gpioa", "gpiob", "gpioc", "gpiod"

/* ADC configuration */
#define ADC_CHANNELS 18

/* UART configuration - console on USART2 (PA2/PA3) */
#define CONSOLE_UART "usart2"

/* SPI configuration - SPI1, SPI2 */
#define SPI_BUS "spi1"

/* I2C configuration - I2C1, I2C2 */
#define I2C_BUS "i2c1"

/* PWM configuration - TIM1, TIM2, TIM3, TIM4 */
#define PWM_DEV "pwm1"

/* Counter/TIMER */
#define TIMER_DEV "timer2"

/* Flash */
#define FLASH_DEV "flash0"

/* Entropy/RNG */
#define ENTROPY_DEV "rng"