/**
 * Zephyr board configuration for Arduino Zero (ATSAMD21G18)
 */

#include <zephyr/kernel.h>

/* GPIO configuration */
#define GPIO_PORTS "gpioa", "gpiob"

/* ADC configuration */
#define ADC_CHANNELS 14

/* UART configuration - console on SERCOM0 (PA11/PA10) */
#define CONSOLE_UART "uart0"

/* SPI configuration - SERCOM1, SERCOM2, SERCOM3, SERCOM4, SERCOM5 */
#define SPI_BUS "spi0"

/* I2C configuration - SERCOM0, SERCOM1, SERCOM2, SERCOM3, SERCOM4, SERCOM5 */
#define I2C_BUS "i2c0"

/* PWM configuration - TCC0, TCC1, TCC2, TC3, TC4, TC5 */
#define PWM_DEV "pwm0"

/* Counter/TIMER */
#define TIMER_DEV "timer0"

/* Flash */
#define FLASH_DEV "flash0"

/* Entropy/RNG */
#define ENTROPY_DEV "rng"

/* USB */
#define USB_DEV "usb_dc"