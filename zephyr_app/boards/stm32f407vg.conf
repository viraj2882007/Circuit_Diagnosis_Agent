/**
 * Zephyr board configuration for STM32F407VG (Nucleo-F407ZG / Discovery)
 */

#include <zephyr/kernel.h>

/* GPIO configuration */
#define GPIO_PORTS "gpioa", "gpiob", "gpioc", "gpiod", "gpioe", "gpiof", "gpiog"

/* ADC configuration */
#define ADC_CHANNELS 24

/* UART configuration - console on USART3 (PB10/PB11) */
#define CONSOLE_UART "usart3"

/* SPI configuration - SPI1, SPI2, SPI3 */
#define SPI_BUS "spi1"

/* I2C configuration - I2C1, I2C2, I2C3 */
#define I2C_BUS "i2c1"

/* PWM configuration - TIM1, TIM3, TIM4, TIM5 */
#define PWM_DEV "pwm1"

/* Counter/TIMER */
#define TIMER_DEV "timer2"

/* Flash */
#define FLASH_DEV "flash0"

/* Entropy/RNG */
#define ENTROPY_DEV "rng"

/* Ethernet */
#define ETH_DEV "eth0"

/* USB */
#define USB_DEV "usb_dc"