/**
 * Zephyr board configuration for Arduino Uno (ATmega328P)
 */

#include <zephyr/kernel.h>

/* GPIO configuration */
#define GPIO_PORTS "gpiob", "gpioc", "gpiod"

/* ADC configuration */
#define ADC_CHANNELS 6

/* UART configuration - console on UART0 (PD0/PD1) */
#define CONSOLE_UART "uart0"

/* SPI configuration - SPI0 */
#define SPI_BUS "spi0"

/* I2C configuration - I2C0 */
#define I2C_BUS "i2c0"

/* PWM configuration - TIMER0, TIMER1, TIMER2 */
#define PWM_DEV "pwm0"

/* Counter/TIMER */
#define TIMER_DEV "timer0"

/* Flash */
#define FLASH_DEV "flash0"

/* Entropy/RNG */
#define ENTROPY_DEV "rng"