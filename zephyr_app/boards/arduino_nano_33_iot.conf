/**
 * Zephyr board configuration for Arduino Nano 33 IoT (ATSAMD51J19)
 */

#include <zephyr/kernel.h>

/* GPIO configuration */
#define GPIO_PORTS "gpioa", "gpiob", "gpioc", "gpiod"

/* ADC configuration */
#define ADC_CHANNELS 16

/* UART configuration - console on SERCOM0 */
#define CONSOLE_UART "uart0"

/* SPI configuration */
#define SPI_BUS "spi0"

/* I2C configuration */
#define I2C_BUS "i2c0"

/* PWM configuration */
#define PWM_DEV "pwm0"

/* Counter/TIMER */
#define TIMER_DEV "timer0"

/* Flash */
#define FLASH_DEV "flash0"

/* Entropy/RNG */
#define ENTROPY_DEV "rng"

/* USB */
#define USB_DEV "usb_dc"

/* WiFi */
#define WIFI_DEV "wifi0"