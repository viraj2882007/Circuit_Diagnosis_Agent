# MCU Diagnostic Firmware - Zephyr Configuration

# Kernel
CONFIG_MULTITHREADING=y
CONFIG_STACK_POINTER_RANDOM=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_SHOW_COLOR=y
CONFIG_LOG_RUNTIME_FILTERING=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT="diag> "
CONFIG_SHELL_CMDS_RESIZE=y
CONFIG_SHELL_HISTORY=y

# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_CONSOLE_ON_DEV_NAME=""

# GPIO
CONFIG_GPIO=y

# ADC
CONFIG_ADC=y

# DAC
CONFIG_DAC=y

# UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_DRV_CMD=y

# SPI
CONFIG_SPI=y

# I2C
CONFIG_I2C=y

# PWM
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y

# Counter/Timer
CONFIG_COUNTER=y

# Flash
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216=y
CONFIG_FLASH_MAP=y

# Entropy/RNG
CONFIG_ENTROPY_HAS_DRIVER=y
CONFIG_ENTROPY_GENERATOR=y

# Hardware Info
CONFIG_HWINFO=y

# Settings/Storage
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_FCB=y

# CRC
CONFIG_CRC32=y
CONFIG_CRC16=y

# Minimal libc
CONFIG_MINIMAL_LIBC=y
CONFIG_NEWLIB_LIBC=y

# Optimization
CONFIG_OPTIMIZE_FOR_SIZE=y
CONFIG_COMPILER_OPT=-Os

# Debug
CONFIG_DEBUG=y
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# Memory protection (if supported)
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y